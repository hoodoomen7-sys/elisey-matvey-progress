function statsPeriodData(u,a,b){
 let closed=range(u,a,b).filter(x=>x.closed),
     offCount=db.off.filter(x=>x.u===u&&x.d>=a&&x.d<=b).length,
     count=closed.reduce((q,x)=>q+shiftCount(x),0),
     earnedTotal=closed.reduce((q,x)=>q+earned(x),0),
     fines=closed.reduce((q,x)=>q+(+x.fine||0),0),
     extras=closed.reduce((q,x)=>q+(+x.ex||0)+(+x.nex||0),0),
     workDays=[...new Set(closed.map(x=>x.d))],
     occupancy=(workDays.length+offCount)?Math.round(workDays.length/(workDays.length+offCount)*100):0,
     avgExtraDay=workDays.length?extras/workDays.length:0,
     morningExtras=closed.filter(x=>x.t==='morning').reduce((q,x)=>q+(+x.ex||0),0),
     day1Extras=closed.filter(x=>x.t==='day1').reduce((q,x)=>q+(+x.ex||0),0),
     day2Extras=closed.filter(x=>x.t==='day2').reduce((q,x)=>q+(+x.ex||0),0),
     eveningExtras=closed.filter(x=>x.t==='eveningnight'||x.t==='short').reduce((q,x)=>q+(+x.ex||0),0),
     nightExtras=closed.filter(x=>x.t==='eveningnight').reduce((q,x)=>q+(+x.nex||0),0),
     byDay={};
 closed.forEach(x=>byDay[x.d]=(byDay[x.d]||0)+earned(x));
 let ranked=Object.entries(byDay).sort((a,b)=>b[1]-a[1]),
     best=ranked.length?ranked[0]:null,
     worst=ranked.length?ranked[ranked.length-1]:null;

 <div class="spark">${vals.map(x=>{let height=18+((x.mark-mn)/span)*44,down=x!==vals[0]&&x.mark<vals[vals.indexOf(x)-1].mark;return `<i class="${down?'down':''}" style="height:${height}px" title="${x.d}: ${x.mark}%"></i>`}).join('')}</div>
 <div class="historyMini">${h.slice().reverse().slice(0,10).map(x=>`<div><span>${new Date(x.d+'T12:00').toLocaleDateString('ru',{day:'numeric',month:'short'})}</span><b>${x.mark.toFixed(2)}% · ${x.battles||0} боёв</b></div>`).join('')}</div>
 <div class="funForm"><input id="tankDate" type="date" value="${today}"><input id="newMark" type="number" step=".01" placeholder="Новая отметка, %"><input class="wide" id="newBattles" type="number" min="0" placeholder="Сколько боёв сыграно"><button class="btn dark" onclick="funTankUpdate()">Записать новое значение</button></div>
 <button class="btn" style="margin-top:7px" onclick="funTankWeekStart()">Исправить старт недели</button> <button class="btn" style="margin-top:7px" onclick="funTankDelete()">Удалить этот танк</button>
 <details style="margin-top:9px"><summary><b>Добавить ещё танк</b></summary><div class="funForm"><input id="tankName" placeholder="Название"><input id="tankMark" type="number" step=".01" placeholder="Отметка, %"><input class="wide" id="tankImg" placeholder="Ссылка на изображение"><button class="btn" onclick="funTankAdd()">Добавить</button></div></details></div>`
}
function faceLevel(e){if(e>=2001)return 10;if(e>=1751)return 9;if(e>=1531)return 8;if(e>=1351)return 7;if(e>=1201)return 6;if(e>=1051)return 5;if(e>=901)return 4;if(e>=751)return 3;if(e>=501)return 2;return 1}
function faceAdd(){
 let map=document.getElementById('fMap').value.trim()||'Матч',score=document.getElementById('fScore').value.trim(),delta=parseInt(document.getElementById('fDelta').value),res=document.getElementById('fRes').value,d=document.getElementById('fDate').value||today;
 if(isNaN(delta))return;
 db.fun.faceit.elo=(+db.fun.faceit.elo||1871)+delta;db.fun.faceit.matches.push({id:String(Date.now()),d,map,score,delta,res});save()
}
function faceSetElo(){let x=+document.getElementById('baseElo').value;if(x>0){db.fun.faceit.elo=x;save()}}
function faceRemove(id){let m=db.fun.faceit.matches.find(x=>x.id===id);if(m)db.fun.faceit.elo-=m.delta;db.fun.faceit.matches=db.fun.faceit.matches.filter(x=>x.id!==id);save()}
function faceCard(){
 let f=db.fun.faceit,wb=weekBoundsNow(),wm=f.matches.filter(x=>x.d>=wb[0]&&x.d<=wb[1]),w=wm.filter(x=>x.res==='W').length,l=wm.filter(x=>x.res==='L').length,wr=wm.length?w/wm.length*100:0,de=wm.reduce((q,x)=>q+x.delta,0),lvl=faceLevel(+f.elo||1871);
 return `<div class="funPanel"><h3>🎯 FACEIT</h3><div class="faceTop"><div class="lvlBadge">${lvl}</div><div><div class="elo">${f.elo} ELO</div><b>Level ${lvl}</b><br><small>Стартовое значение проекта: 1871 ELO</small></div></div>
 <div class="funMetrics"><div class="funMetric"><b class="${de>0?'deltaUp':de<0?'deltaDown':''}">${de>0?'+':''}${de}</b><small>ELO за неделю</small></div><div class="funMetric"><b class="${wr>=50?'deltaUp':'deltaDown'}">${wr.toFixed(1)}%</b><small>Winrate</small></div><div class="funMetric"><b>${w}–${l}</b><small>Победы / поражения</small></div></div>
 <div class="funForm"><input id="fDate" type="date" value="${today}"><select id="fRes"><option value="W">Победа</option><option value="L">Поражение</option></select><input id="fMap" placeholder="Карта"><input id="fScore" placeholder="Счёт, напр. 13:8"><input class="wide" id="fDelta" type="number" placeholder="+ / − ELO"><button class="btn dark" onclick="faceAdd()">Добавить матч</button></div>
 <div style="margin-top:10px">${f.matches.slice().reverse().slice(0,10).map(x=>`<div class="match"><b class="${x.res==='W'?'win':'loss'}">${x.res==='W'?'WIN':'LOSS'}</b><span>${x.map}${x.score?' · '+x.score:''}<br><small>${new Date(x.d+'T12:00').toLocaleDateString('ru',{day:'numeric',month:'short'})}</small></span><span class="${x.delta>=0?'deltaUp':'deltaDown'}"><b>${x.delta>0?'+':''}${x.delta}</b> <button onclick="faceRemove('${x.id}')">×</button></span></div>`).join('')||'<p class="mut">Матчей пока нет.</p>'}</div>
 <details style="margin-top:9px"><summary><b>Исправить текущее ELO вручную</b></summary><div class="funForm"><input class="wide" id="baseElo" type="number" value="${f.elo}"><button class="btn" onclick="faceSetElo()">Сохранить ELO</button></div></details></div>`
}

function ppChange(u,n){db.fun.pingpong[u]=Math.max(0,(+db.fun.pingpong[u]||0)+n);save()}
function ppSet(){
 let e=prompt('Победы Елисея:',db.fun.pingpong.e||0);if(e===null)return;
 let m=prompt('Победы Матвея:',db.fun.pingpong.m||0);if(m===null)return;
 db.fun.pingpong.e=Math.max(0,+e||0);db.fun.pingpong.m=Math.max(0,+m||0);save()
}
function pingPongCard(){
 let p=db.fun.pingpong||{e:0,m:0},total=(+p.e||0)+(+p.m||0);
 return `<div class="ppCard"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><b>🏓 Личные встречи</b><br><small class="mut">Настольный теннис · всего матчей: ${total}</small></div><button class="btn" onclick="ppSet()">✎ Счёт</button></div>
 <div class="ppScore"><div class="ppSide e"><small>Елисей</small><b>${p.e||0}</b></div><div class="ppVs">:</div><div class="ppSide m"><small>Матвей</small><b>${p.m||0}</b></div></div>
 <div class="ppEdit"><button class="btn" onclick="ppChange('e',1)">+ Елисей</button><button class="btn" onclick="ppChange('m',1)">+ Матвей</button><button class="btn" onclick="ppChange('e',-1)">− Елисей</button><button class="btn" onclick="ppChange('m',-1)">− Матвей</button></div></div>`
}
function debtAdd(owner){
 let kind=document.getElementById('debtKind').value,what=document.getElementById('debtWhat').value.trim(),amount=+document.getElementById('debtAmount').value||0,to=document.getElementById('debtTo').value;
 if(kind==='money'&&!amount)return;if(kind==='thing'&&!what)return;
 db.fun.debts.push({id:String(Date.now()),owner,to,kind,amount,what,d:today,done:false});save()
}
function debtDone(id){let x=db.fun.debts.find(x=>x.id===id);if(x)x.done=true;save()}
function debtDelete(id){db.fun.debts=db.fun.debts.filter(x=>x.id!==id);save()}
function debtCard(u){
 let arr=db.fun.debts.filter(x=>x.owner===u&&!x.done),other=u==='e'?'m':'e';
 return `<div class="debtCard"><h3>🤝 Долги и обещания</h3><p class="mut">${U[u][0]} должен${u==='m'?'':' '}:</p>
 ${arr.length?arr.map(x=>`<div class="debtItem"><div class="debtText"><b>${x.kind==='money'?`<span class="debtMoney">${money(x.amount)}</span>`:`<span class="debtThing">${x.what}</span>`}</b><small>${x.to==='e'?'Елисею':'Матвею'} · ${new Date(x.d+'T12:00').toLocaleDateString('ru',{day:'numeric',month:'short'})}</small></div><div><button onclick="debtDone('${x.id}')" title="Погашено">✓</button> <button onclick="debtDelete('${x.id}')" title="Удалить">×</button></div></div>`).join(''):'<p class="mut">Сейчас ничего не должен. Подозрительно благополучно.</p>'}
 <details><summary><b>+ Добавить</b></summary><div class="debtForm"><select id="debtKind" onchange="document.getElementById('debtAmount').style.display=this.value==='money'?'':'none';document.getElementById('debtWhat').style.display=this.value==='thing'?'':'none'"><option value="money">Деньги</option><option value="thing">Предмет / обещание</option></select><select id="debtTo"><option value="${other}">${U[other][0]}</option><option value="${u}">${U[u][0]}</option></select><input id="debtAmount" type="number" min="0" step="50" placeholder="Сумма, ₽"><input id="debtWhat" class="wide" style="display:none" placeholder="Например: энергетик"><button class="btn dark wide" onclick="debtAdd('${u}')">Добавить долг</button></div></details></div>`
}
function leisure(){
 let u=db.fun.owner||'e';
 return `<section class="card">${pingPongCard()}<div class="funSwitch"><button class="${u==='e'?'onE':''}" onclick="funOwner('e')">Елисей</button><button class="${u==='m'?'onM':''}" onclick="funOwner('m')">Матвей</button></div>
 ${debtCard(u)}
 ${u==='m'?`<div class="emptyMate"><div><h2>Матвей</h2><p>Профиль пока пустой.</p><small>Здесь позже можно разместить тренажёрный зал или другие показатели.</small></div></div>`:`<div class="funGrid">${tankCard()}${faceCard()}</div>`}
 </section>`
}
function settings(){return `<section class="card"><h2>Ставки</h2><p class="mut">Новые ставки применяются к новым сменам. Стоимость дополнительных игр для блока «Вечер + ночь» настраивается отдельно.</p>${Object.keys(D).map(k=>`<p><b>${rate(k)[0]}</b><br>фикс <input id="f${k}" type="number" value="${rate(k)[1]}">${k!=='eveningnight'?` · доп <input id="x${k}" type="number" value="${rate(k)[2]}">`:''}</p>`).join('')}
<div class="card" style="margin:14px 0 0;padding:14px;background:#f8fafc">
<h3 style="margin-top:0">Доп. игры · Вечер + ночь</h3>
<p><b>Вечер</b><br>стоимость одной доп. игры <input id="xEveningExtra" type="number" value="${db.extraRates.evening}"> ₽</p>
<p><b>Ночь</b><br>стоимость одной доп. игры <input id="xNightExtra" type="number" value="${db.extraRates.night}"> ₽</p>
</div>
<button class="btn dark" onclick="rates()">Сохранить</button></section>`}
function rates(){
 Object.keys(D).forEach(k=>{
   db.rates[k][1]=+document.getElementById('f'+k).value;
   let xi=document.getElementById('x'+k);if(xi)db.rates[k][2]=+xi.value
 });
 db.extraRates.evening=+document.getElementById('xEveningExtra').value||0;
 db.extraRates.night=+document.getElementById('xNightExtra').value||0;
 save()
}
let v='home';function render(){view.innerHTML=v==='home'?home():v==='cal'?cal():v==='leisure'?leisure():v==='notes'?notes():v==='stats'?stats():settings()}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');v=b.dataset.v;render()});modal.onclick=e=>{if(e.target===modal)modal.classList.remove('on')};render();
cloudFetch();
cloudTimer=setInterval(()=>{if(!document.hidden&&!document.querySelector('.modal.on'))cloudFetch()},30000);
window.addEventListener('focus',cloudFetch);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)cloudFetch()});
</script></body></html>

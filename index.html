<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Елисей & Матвей — Progress</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#77808c;--line:#e5e9ee;--accent:#202a35;--ok:#2f8f5b;--soft:#eef2f5}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:1180px;margin:0 auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:18px}.top h1{margin:0;font-size:28px}.top .date{color:var(--muted);font-size:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button,.btn{border:1px solid var(--line);background:var(--card);padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:650;color:var(--text)}.tabs button.active,.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 4px 18px rgba(20,30,40,.04)}.personHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.personHead h2{margin:0;font-size:22px}.badge{font-size:12px;background:var(--soft);padding:6px 9px;border-radius:999px;color:var(--muted)}
.progress{height:10px;background:var(--soft);border-radius:999px;overflow:hidden;margin:8px 0 14px}.progress>i{display:block;height:100%;background:var(--accent);width:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.stat{background:var(--soft);border-radius:12px;padding:10px}.stat b{display:block;font-size:18px}.stat span{font-size:12px;color:var(--muted)}
.task{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}.task input{width:18px;height:18px}.task .name{flex:1}.task .del{border:0;background:none;color:#a1a8b0;cursor:pointer;font-size:18px}.addrow{display:flex;gap:8px;margin-top:12px}.addrow input,.moneyrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}.moneyrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:12px}
.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sectionTitle h3{margin:0}.common{margin-top:16px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{background:var(--soft);border-radius:10px;padding:9px 5px;text-align:center;font-size:12px}.day b{display:block;font-size:15px;margin-top:4px}.empty{color:var(--muted);padding:16px 0}.footerNote{color:var(--muted);font-size:12px;margin-top:18px;text-align:center}
@media(max-width:760px){.app{padding:14px}.grid2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.moneyrow{grid-template-columns:1fr 1fr}.moneyrow button{grid-column:1/-1}.top{align-items:start;flex-direction:column}.week{grid-template-columns:repeat(7,minmax(38px,1fr))}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div><h1>Елисей & Матвей</h1><div class="date" id="todayLabel"></div></div><div class="date">Совместный трекер прогресса</div></div>
  <div class="tabs"><button class="active" data-tab="today">Сегодня</button><button data-tab="week">Неделя</button><button data-tab="history">История</button></div>
  <main id="view"></main>
  <div class="footerNote" id="syncStatus">Подключение к общей базе…</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://srefstrwdljdrbpbjlcj.supabase.co';
const SUPABASE_KEY='sb_publishable_nS_JdVvDGWlazxXohyhpXw_eek9oaQE';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const USERS=[{id:1,name:'Елисей'},{id:2,name:'Матвей'}];
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const today=iso(new Date());
let state={tasks:[],shared:[],stats:[],historyTasks:[],historyStats:[]};
let tab='today';
const view=document.getElementById('view');
const statusEl=document.getElementById('syncStatus');
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function money(n){return new Intl.NumberFormat('ru-RU').format(+n||0)+' ₽'}
function pct(tasks){return tasks.length?Math.round(tasks.filter(t=>t.completed).length/tasks.length*100):0}
function monday(d=new Date()){let x=new Date(d),w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);x.setHours(0,0,0,0);return x}
function weekDates(){let m=monday();return Array.from({length:7},(_,i)=>{let d=new Date(m);d.setDate(m.getDate()+i);return iso(d)})}
function statFor(uid,date=today){return state.stats.find(x=>x.user_id===uid&&x.stat_date===date)||{work_hours:0,income:0}}
function tasksFor(uid,date=today){return state.tasks.filter(x=>x.user_id===uid&&x.task_date===date)}
function setStatus(text,bad=false){statusEl.textContent=text;statusEl.style.color=bad?'#b42318':''}
async function load(){
  setStatus('Синхронизация…');
  const dates=weekDates(), from=dates[0], to=dates[6];
  const [t,s,c]=await Promise.all([
    db.from('daily_tasks').select('*').gte('task_date',from).lte('task_date',to).order('created_at'),
    db.from('daily_stats').select('*').gte('stat_date',from).lte('stat_date',to),
    db.from('shared_tasks').select('*').eq('task_date',today).order('created_at')
  ]);
  const err=t.error||s.error||c.error;
  if(err){console.error(err);setStatus('Ошибка синхронизации: '+err.message,true);return}
  state.tasks=t.data||[]; state.stats=s.data||[]; state.shared=c.data||[];
  setStatus('Общая база подключена · изменения видны Елисею и Матвею');render();
}
function userCard(u){let tasks=tasksFor(u.id),st=statFor(u.id),p=pct(tasks);return `<section class="card"><div class="personHead"><h2>${u.name}</h2><span class="badge">${tasks.filter(x=>x.completed).length}/${tasks.length} задач</span></div><div class="progress"><i style="width:${p}%"></i></div><div class="stats"><div class="stat"><b>${p}%</b><span>прогресс</span></div><div class="stat"><b>${+st.work_hours||0}</b><span>часов</span></div><div class="stat"><b>${money(st.income)}</b><span>заработано</span></div></div><div>${tasks.length?tasks.map(t=>`<label class="task"><input type="checkbox" ${t.completed?'checked':''} onchange="toggleTask(${t.id},${!t.completed})"><span class="name">${esc(t.title)}</span><button class="del" onclick="event.preventDefault();delTask(${t.id})">×</button></label>`).join(''):'<div class="empty">Задач пока нет.</div>'}</div><div class="addrow"><input id="task-${u.id}" placeholder="Новая задача" onkeydown="if(event.key==='Enter')addTask(${u.id})"><button class="btn" onclick="addTask(${u.id})">Добавить</button></div><div class="moneyrow"><input id="hours-${u.id}" type="number" min="0" step="0.5" placeholder="Часы" value="${+st.work_hours||''}"><input id="money-${u.id}" type="number" min="0" step="100" placeholder="Заработок" value="${+st.income||''}"><button class="btn" onclick="setWork(${u.id})">Сохранить</button></div></section>`}
function commonBlock(){return `<section class="card common"><div class="sectionTitle"><h3>Общие задачи</h3><span class="badge">выполнить обоим</span></div>${state.shared.length?state.shared.map(t=>`<div class="task"><span class="name">${esc(t.title)}</span><label title="Елисей">Е <input type="checkbox" ${t.elisey_completed?'checked':''} onchange="toggleCommon(${t.id},'elisey_completed',${!t.elisey_completed})"></label><label title="Матвей">М <input type="checkbox" ${t.matvey_completed?'checked':''} onchange="toggleCommon(${t.id},'matvey_completed',${!t.matvey_completed})"></label><button class="del" onclick="delCommon(${t.id})">×</button></div>`).join(''):'<div class="empty">Общих задач пока нет.</div>'}<div class="addrow"><input id="commonInput" placeholder="Например: закончить общий проект" onkeydown="if(event.key==='Enter')addCommon()"><button class="btn" onclick="addCommon()">Добавить</button></div></section>`}
function renderToday(){view.innerHTML=`<div class="grid2">${USERS.map(userCard).join('')}</div>${commonBlock()}`}
function weeklyFor(uid){let dates=weekDates(),tasks=0,done=0,h=0,m=0;dates.forEach(dt=>{let tt=tasksFor(uid,dt),ss=statFor(uid,dt);tasks+=tt.length;done+=tt.filter(t=>t.completed).length;h+=+ss.work_hours||0;m+=+ss.income||0});return {tasks,done,h,m,p:tasks?Math.round(done/tasks*100):0}}
function renderWeek(){let dates=weekDates();view.innerHTML=`<div class="grid2">${USERS.map(u=>{let s=weeklyFor(u.id);return `<section class="card"><div class="personHead"><h2>${u.name}</h2><span class="badge">эта неделя</span></div><div class="progress"><i style="width:${s.p}%"></i></div><div class="stats"><div class="stat"><b>${s.done}/${s.tasks}</b><span>задач</span></div><div class="stat"><b>${s.h}</b><span>часов</span></div><div class="stat"><b>${money(s.m)}</b><span>заработано</span></div></div><div class="week">${dates.map(dt=>`<div class="day">${new Date(dt+'T12:00').toLocaleDateString('ru-RU',{weekday:'short'})}<b>${pct(tasksFor(u.id,dt))}%</b></div>`).join('')}</div></section>`}).join('')}</div>`}
async function renderHistory(){view.innerHTML='<section class="card"><div class="empty">Загрузка истории…</div></section>';const [t,s]=await Promise.all([db.from('daily_tasks').select('*').order('task_date',{ascending:false}),db.from('daily_stats').select('*').order('stat_date',{ascending:false})]);if(t.error||s.error){view.innerHTML='<section class="card"><div class="empty">Не удалось загрузить историю.</div></section>';return}let dates=[...new Set([...(t.data||[]).map(x=>x.task_date),...(s.data||[]).map(x=>x.stat_date)])].sort().reverse();view.innerHTML=`<section class="card"><div class="sectionTitle"><h3>История</h3><span class="badge">${dates.length} дней</span></div>${dates.length?dates.map(dt=>`<div class="task"><span class="name"><b>${new Date(dt+'T12:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}</b></span>${USERS.map(u=>{let tt=(t.data||[]).filter(x=>x.user_id===u.id&&x.task_date===dt),ss=(s.data||[]).find(x=>x.user_id===u.id&&x.stat_date===dt)||{};return `<span>${u.name}: ${pct(tt)}% · ${money(ss.income)}</span>`}).join(' &nbsp; ')}</div>`).join(''):'<div class="empty">История появится после первых отметок.</div>'}</section>`}
function render(){document.getElementById('todayLabel').textContent=new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});if(tab==='today')renderToday();else if(tab==='week')renderWeek();else renderHistory()}
async function addTask(uid){let el=document.getElementById('task-'+uid),v=el.value.trim();if(!v)return;let r=await db.from('daily_tasks').insert({user_id:uid,task_date:today,title:v});if(r.error)return setStatus(r.error.message,true);await load()}
async function toggleTask(id,val){let r=await db.from('daily_tasks').update({completed:val}).eq('id',id);if(r.error)return setStatus(r.error.message,true);await load()}
async function delTask(id){let r=await db.from('daily_tasks').delete().eq('id',id);if(r.error)return setStatus(r.error.message,true);await load()}
async function setWork(uid){let work_hours=+document.getElementById('hours-'+uid).value||0,income=+document.getElementById('money-'+uid).value||0;let r=await db.from('daily_stats').upsert({user_id:uid,stat_date:today,work_hours,income,updated_at:new Date().toISOString()},{onConflict:'user_id,stat_date'});if(r.error)return setStatus(r.error.message,true);await load()}
async function addCommon(){let e=document.getElementById('commonInput'),v=e.value.trim();if(!v)return;let r=await db.from('shared_tasks').insert({task_date:today,title:v});if(r.error)return setStatus(r.error.message,true);await load()}
async function toggleCommon(id,field,val){let r=await db.from('shared_tasks').update({[field]:val}).eq('id',id);if(r.error)return setStatus(r.error.message,true);await load()}
async function delCommon(id){let r=await db.from('shared_tasks').delete().eq('id',id);if(r.error)return setStatus(r.error.message,true);await load()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render()});
load();
setInterval(load,15000);
</script>
</body>
</html>
